name: Deploy to GitHub Pages
run-name: ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: devforge
        run: npm install

      - name: Build project
        working-directory: devforge
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: devforge/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  auto-tag:
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    needs: deploy
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag_created: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine bump type from commit message
        id: type
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $MSG"
          if echo "$MSG" | grep -qE "(BREAKING CHANGE|^[a-z]+(\(.+\))?!:)"; then
            BUMP=major
          elif echo "$MSG" | grep -qE "^feat(\(.+\))?:"; then
            BUMP=minor
          elif echo "$MSG" | grep -qE "^(fix|perf)(\(.+\))?:"; then
            BUMP=patch
          else
            BUMP=none
          fi
          echo "Detected bump: $BUMP"
          echo "bump=$BUMP" >> $GITHUB_OUTPUT

      - name: Bump version, commit, tag, push
        id: bump
        if: steps.type.outputs.bump != 'none'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          cd devforge
          NEW_TAG=$(npm version ${{ steps.type.outputs.bump }} --no-git-tag-version)
          VERSION_NO_V="${NEW_TAG#v}"
          cd ..
          echo "version=$VERSION_NO_V" >> $GITHUB_OUTPUT
          echo "bumped=true" >> $GITHUB_OUTPUT
          git add devforge/package.json devforge/package-lock.json
          git commit -m "chore: release $NEW_TAG [skip ci]"
          git tag "$NEW_TAG"
          git push origin main
          git push origin "$NEW_TAG"

  release:
    runs-on: windows-latest
    if: needs.auto-tag.outputs.tag_created == 'true'
    needs: [auto-tag]
    steps:
      - name: Checkout at new tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.auto-tag.outputs.version }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate release notes
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "Previous tag: $PREV_TAG"
          node .github/scripts/release-notes.mjs "$PREV_TAG" "v${{ needs.auto-tag.outputs.version }}" > release-notes.md
          echo "----- Release notes -----"
          cat release-notes.md
          echo "-------------------------"
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Install dependencies
        working-directory: devforge
        run: npm install

      - name: Build Electron app
        working-directory: devforge
        run: npm run electron:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.auto-tag.outputs.version }}
          body_path: release-notes.md
          files: |
            devforge/release/*.exe
            devforge/release/*.dmg
            devforge/release/*.AppImage
            devforge/release/*.deb
            devforge/release/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
