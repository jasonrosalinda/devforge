name: Deploy to GitHub Pages
run-name: ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: devforge
        run: npm install

      - name: Build project
        working-directory: devforge
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: devforge/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  auto-tag:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: deploy
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag_created: ${{ steps.tag.outputs.created }}
    steps:
    - uses: actions/checkout@v4

    - name: Get version from package.json
      id: version
      working-directory: devforge
      run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

    - name: Create tag if not exists
      id: tag
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        if git tag "v${{ steps.version.outputs.VERSION }}"; then
          git push origin "v${{ steps.version.outputs.VERSION }}"
          echo "created=true" >> $GITHUB_OUTPUT
        else
          echo "Tag already exists, skipping"
          echo "created=false" >> $GITHUB_OUTPUT
        fi

  release:
    runs-on: windows-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (needs.auto-tag.outputs.tag_created == 'true')
    needs: [auto-tag]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: devforge
        run: npm install

      - name: Build Electron app
        working-directory: devforge
        run: npm run electron:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.auto-tag.outputs.version }}
          files: |
            devforge/release/*.exe
            devforge/release/*.dmg
            devforge/release/*.AppImage
            devforge/release/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}